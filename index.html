<script>
const {
  useState,
  useEffect,
  useMemo,
  useRef
} = React;
const CSS = `
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@300;400;500&display=swap");
:root{
  --ink:#100E0C; --ink-2:#17140F; --panel:#1D1913; --panel-2:#241F18;
  --line:rgba(240,228,206,.12); --line-2:rgba(240,228,206,.22);
  --cream:#F2EAD9; --cream-dim:rgba(242,234,217,.62); --cream-faint:rgba(242,234,217,.38);
  --brass:#C9974A; --brass-lite:#E3B76F; --live:#D96A4A; --wrap:#7FA37C; --paid:#6E9BC4;
  --pad:18px; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--cream)}
body{font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(120% 60% at 50% -10%, rgba(201,151,74,.16), transparent 60%),
             radial-gradient(90% 50% at 100% 100%, rgba(217,106,74,.07), transparent 70%)}
h1,h2,h3,.disp{font-family:"Cormorant Garamond",serif;font-weight:400;letter-spacing:.01em;margin:0}
.mono{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--cream-faint);font-weight:500}

.app{position:relative;z-index:1;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 10px;
  background:linear-gradient(to bottom,var(--ink) 62%,rgba(16,14,12,.88) 88%,transparent);backdrop-filter:blur(6px)}
.topbar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:baseline;gap:9px}
.mark .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none;transform:translateY(-3px)}
.mark h1{font-size:30px;line-height:1}
.mark h1 em{font-style:italic;color:var(--brass-lite)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--cream-dim);display:grid;place-items:center;font-size:17px;flex:none;cursor:pointer}
.iconbtn:active{background:var(--panel-2)}
.owed{margin-top:10px;font-size:12px;color:var(--cream-dim);letter-spacing:.04em}
.owed b{color:var(--brass-lite);font-weight:500;font-family:"DM Mono",monospace}

.filters{display:flex;gap:7px;overflow-x:auto;padding:10px var(--pad) 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters.brands{padding-top:8px}
.pill{flex:none;border:1px solid var(--line);background:transparent;color:var(--cream-dim);padding:8px 15px;
  border-radius:100px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.pill .n{opacity:.5;margin-left:6px}
